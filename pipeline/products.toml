lane = "coast.noaa.gov"

[steps.ices-areas]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=ices-areas"]
lane = "gis.ices.dk"

[steps.ices-rectangles]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=ices-rectangles"]
lane = "gis.ices.dk"

[steps.dfo-areas]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=dfo-areas"]
lane = "egisp.dfo-mpo.gc.ca"
timeout_minutes = 30

[steps.nafo-divisions]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=nafo-divisions"]
lane = "egisp.dfo-mpo.gc.ca"

[steps.marine-refuges]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=marine-refuges"]
lane = "egisp.dfo-mpo.gc.ca"

[products.fao-areas]
title = "FAO Major Fishing Areas for Statistical Purposes, from the major areas to their subunits (FAO, CC BY 4.0)"
step = "fao-areas"
roots = ["fao-areas.json"]
writes = ["fao-areas.json"]
namespace = ["python3", "scripts/fetch-fisheries.py", "--namespace", "--only=fao-areas"]
max_age_hours = 1500
r2_only = true
trees = ["land/fao-areas"]

