# What this repository publishes: fisheries' management areas, fifteen products, each a root of every record and a
# pyramid of Mapbox vector tiles made from it, `land/<product>/` (an index and its versioned tiles): FAO's Major
# Fishing Areas and the regional fishery bodies' areas of competence; the eight U.S. Regional Fishery Management
# Councils' regions; NOAA Fisheries' West Coast groundfish conservation areas, its Greater Atlantic regulated and
# statistical areas, its habitat areas of particular concern, its essential fish habitat areas protected from
# fishing and its compilation of bottom-gear and trawl restrictions; MarineCadastre's deep-sea coral protection
# areas; ICES's areas and statistical rectangles; and Fisheries and Oceans Canada's Atlantic and Arctic fisheries
# management areas, NAFO divisions and marine refuges. The fetcher is the site's `scripts/fetch-fisheries.py`,
# whose docstring carries the measurements; the tiles are written by the site's `scripts/land_tiles.py`, through
# `scripts/fetch-maritime.py`'s machinery.
#
# **To the second host alone** (`r2_only`, the site pipeline's D13, its note of 2026-10-09): every file of
# each product is published to Cloudflare R2 and not to Pages, which carries the status alone; the roots
# stay on the `published` branch, where the next run seeds from them. `trees` names the folder each product
# writes beside its root (the orchestrator's, 2026-10-20), so it goes to R2 with it.
#
# **Each step runs every run; each source is read on its own cadence.** A tree is never banked, so each
# pyramid is made again from its published root on every run, whether the workflow's cache restored it or
# not, and the fetcher reads a source itself only once its root is that old (`every_hours` in the fetcher):
# the West Coast's groundfish areas and GARFO's regulated areas weekly (a rule can move them in any week), the
# councils' regions and GARFO's statistical areas quarterly, the rest monthly. **Never give a step
# `every_hours`**: a step not run writes no `land/`.
#
# **The budgets.** Where a service gives no date of its own (FAO's WFS, the West Coast's, ICES's and Fisheries and
# Oceans Canada's map services), a product's hour is the read's own: the groundfish areas 360 hours, a week's read,
# one missed and a day; the rest 1,500, a month's read, one missed and a few days. Where the service gives its
# layer's last data edit (NOAA Fisheries' and MarineCadastre's feature services), the hour is that edit, which an
# old date is no fault of: no budget.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

[steps.fao-areas]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=fao-areas"]
lane = "www.fao.org"

[steps.fishery-bodies]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=fishery-bodies"]
lane = "www.fao.org"

[steps.council-regions]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=council-regions"]
lane = "services2.arcgis.com"

[steps.groundfish-areas]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=groundfish-areas"]
lane = "maps.fisheries.noaa.gov"

[steps.garfo-areas]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=garfo-areas"]
lane = "services2.arcgis.com"
timeout_minutes = 40

[steps.statistical-areas]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=statistical-areas"]
lane = "services2.arcgis.com"

[steps.hapc]
cmd = ["python3", "scripts/fetch-fisheries.py", "--only=hapc"]
lane = "services2.arcgis.com"

[steps.fishing-restrictions]
