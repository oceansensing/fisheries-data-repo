# Publish this repository's products: fetch with the site's pipelines,
# validate against the site's contract, and publish one build to GitHub Pages
# and to Cloudflare R2. Written by the site's pipeline/scaffold/new-origin.py
# from the sibling data repositories' workflow.
#
# **Dispatch-only until a dispatched run has published a tree**: prove the
# pipeline, THEN uncomment the schedule below, in the same commit as the docs.
# `status/status.json` reports `schedule: null` until then, and the site's
# watchdog names an origin with no schedule on sight.
#
# Needs, from the owner: `PIPELINES_SSH_KEY` (this repository's read-only
# deploy key on oceansensing.github.io) and the organization's R2_* secrets.
#
# **A dispatch's `due` names steps whose source is read now** whatever their
# interval (the groundfish and GARFO areas are read weekly, the councils' regions
# and the statistical areas quarterly, the rest monthly): `due=garfo-areas`, `due=all`.

name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the probe says the tree is current'
        type: boolean
        default: false
      due:
        description: 'Steps to read their source now whatever their interval (comma list, or all)'
        type: string
        default: ''
  schedule:
    - cron: '53 10 * * *'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      behind: ${{ steps.run.outputs.behind }}
    steps:
      # This repository first: actions/checkout cleans its destination, so
      # taking the root after the others would wipe them.
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the pipelines
        id: pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Say why the pipelines could not be checked out
        if: failure() && steps.pipelines.outcome == 'failure'
        run: |
          echo "::error title=Cannot read the pipelines::Could not check out oceansensing/oceansensing.github.io. Read the step log first - the causes look alike."
          echo "::error title=If the log says 'error in libcrypto'::The key could not be PARSED - almost always a missing trailing newline on PIPELINES_SSH_KEY. Re-paste the whole file (pbcopy < keyfile), or set it with gh secret set < keyfile."
          echo "::error title=If the log says only 'Permission denied (publickey)'::The public half is missing from the site repository's Deploy keys page, was revoked, or does not match."
          echo "::error title=If the log says 'Repository not found'::The secret is unset or empty, so the checkout fell back to GITHUB_TOKEN, which holds no grant on the site repository."
      - name: Check out the last publish
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: published
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install what the fetchers need
        run: pip install --no-cache-dir -r site/scripts/requirements-lands.txt
      - name: Unit-test the orchestrator
        working-directory: site
        run: python3 pipeline/test_orchestrate.py
      - name: Self-test fetch-fisheries.py
        run: python3 site/scripts/fetch-fisheries.py --self-test
      - name: Self-test fetch-maritime.py
        run: python3 site/scripts/fetch-maritime.py --self-test
      - name: Self-test land_tiles.py
        run: python3 site/scripts/land_tiles.py --self-test
      - name: Self-test point_tiles.py
        run: python3 site/scripts/point_tiles.py --self-test
      - name: Self-test mvt.py
        run: python3 site/scripts/mvt.py --self-test
      - name: Seed the stage from the last publish
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py seed
      # Each product's pyramid as last published, from the cache, under the version its root names: with it,
      # a run whose product is held still publishes the tiles it had. The steps make each pyramid from its
      # root every run, so a cache that misses costs nothing but that.
      - name: The published pyramids' versions
        id: trees
        run: |
          for p in fao-areas fishery-bodies council-regions groundfish-areas garfo-areas statistical-areas hapc fishing-restrictions efh-closed-areas coral-protection ices-areas ices-rectangles dfo-areas nafo-divisions marine-refuges; do
            v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" published/map/$p.json 2>/dev/null || echo none)
            echo "${p//-/_}=$v" >> "$GITHUB_OUTPUT"
          done
      - name: Restore the fao-areas tiles
        id: fao-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/fao-areas
          key: fisheries-fao-areas-${{ steps.trees.outputs.fao_areas }}
      - name: Restore the fishery-bodies tiles
        id: fishery-bodies-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/fishery-bodies
          key: fisheries-fishery-bodies-${{ steps.trees.outputs.fishery_bodies }}
      - name: Restore the council-regions tiles
        id: council-regions-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/council-regions
          key: fisheries-council-regions-${{ steps.trees.outputs.council_regions }}
      - name: Restore the groundfish-areas tiles
        id: groundfish-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/groundfish-areas
          key: fisheries-groundfish-areas-${{ steps.trees.outputs.groundfish_areas }}
      - name: Restore the garfo-areas tiles
        id: garfo-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/garfo-areas
          key: fisheries-garfo-areas-${{ steps.trees.outputs.garfo_areas }}
      - name: Restore the statistical-areas tiles
        id: statistical-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/statistical-areas
          key: fisheries-statistical-areas-${{ steps.trees.outputs.statistical_areas }}
      - name: Restore the hapc tiles
        id: hapc-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/hapc
          key: fisheries-hapc-${{ steps.trees.outputs.hapc }}
      - name: Restore the fishing-restrictions tiles
        id: fishing-restrictions-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/fishing-restrictions
          key: fisheries-fishing-restrictions-${{ steps.trees.outputs.fishing_restrictions }}
      - name: Restore the efh-closed-areas tiles
        id: efh-closed-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/efh-closed-areas
          key: fisheries-efh-closed-areas-${{ steps.trees.outputs.efh_closed_areas }}
      - name: Restore the coral-protection tiles
        id: coral-protection-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/coral-protection
          key: fisheries-coral-protection-${{ steps.trees.outputs.coral_protection }}
      - name: Restore the ices-areas tiles
        id: ices-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/ices-areas
          key: fisheries-ices-areas-${{ steps.trees.outputs.ices_areas }}
      - name: Restore the ices-rectangles tiles
        id: ices-rectangles-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/ices-rectangles
          key: fisheries-ices-rectangles-${{ steps.trees.outputs.ices_rectangles }}
      - name: Restore the dfo-areas tiles
        id: dfo-areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/dfo-areas
          key: fisheries-dfo-areas-${{ steps.trees.outputs.dfo_areas }}
      - name: Restore the nafo-divisions tiles
        id: nafo-divisions-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/nafo-divisions
          key: fisheries-nafo-divisions-${{ steps.trees.outputs.nafo_divisions }}
      - name: Restore the marine-refuges tiles
        id: marine-refuges-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/marine-refuges
          key: fisheries-marine-refuges-${{ steps.trees.outputs.marine_refuges }}
      - name: Plan the run
        id: plan
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py plan --mode full
      - name: Fetch, validate, assemble
        id: run
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          PIPELINE_DUE_NOW: ${{ inputs.due }}
        run: python3 site/pipeline/orchestrate.py run
      # A set this run made anew is saved under its own version, for the next run to restore.
      # And so is a set its restore missed: else every run after the cache was evicted would miss it
      # again and build it again.
      - name: Name the sets on the stage
        id: sets
        if: always()
        run: |
          for p in fao-areas fishery-bodies council-regions groundfish-areas garfo-areas statistical-areas hapc fishing-restrictions efh-closed-areas coral-protection ices-areas ices-rectangles dfo-areas nafo-divisions marine-refuges; do
            v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" site/public/map/land/$p/index.json 2>/dev/null || echo none)
            echo "${p//-/_}=$v" >> "$GITHUB_OUTPUT"
          done
      - name: Save the fao-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.fao_areas != 'none' && (steps.sets.outputs.fao_areas != steps.trees.outputs.fao_areas || steps.fao-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/fao-areas
          key: fisheries-fao-areas-${{ steps.sets.outputs.fao_areas }}
      - name: Save the fishery-bodies tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.fishery_bodies != 'none' && (steps.sets.outputs.fishery_bodies != steps.trees.outputs.fishery_bodies || steps.fishery-bodies-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/fishery-bodies
          key: fisheries-fishery-bodies-${{ steps.sets.outputs.fishery_bodies }}
      - name: Save the council-regions tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.council_regions != 'none' && (steps.sets.outputs.council_regions != steps.trees.outputs.council_regions || steps.council-regions-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/council-regions
          key: fisheries-council-regions-${{ steps.sets.outputs.council_regions }}
      - name: Save the groundfish-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.groundfish_areas != 'none' && (steps.sets.outputs.groundfish_areas != steps.trees.outputs.groundfish_areas || steps.groundfish-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/groundfish-areas
          key: fisheries-groundfish-areas-${{ steps.sets.outputs.groundfish_areas }}
      - name: Save the garfo-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.garfo_areas != 'none' && (steps.sets.outputs.garfo_areas != steps.trees.outputs.garfo_areas || steps.garfo-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/garfo-areas
          key: fisheries-garfo-areas-${{ steps.sets.outputs.garfo_areas }}
      - name: Save the statistical-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.statistical_areas != 'none' && (steps.sets.outputs.statistical_areas != steps.trees.outputs.statistical_areas || steps.statistical-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/statistical-areas
          key: fisheries-statistical-areas-${{ steps.sets.outputs.statistical_areas }}
      - name: Save the hapc tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.hapc != 'none' && (steps.sets.outputs.hapc != steps.trees.outputs.hapc || steps.hapc-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/hapc
          key: fisheries-hapc-${{ steps.sets.outputs.hapc }}
      - name: Save the fishing-restrictions tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.fishing_restrictions != 'none' && (steps.sets.outputs.fishing_restrictions != steps.trees.outputs.fishing_restrictions || steps.fishing-restrictions-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/fishing-restrictions
          key: fisheries-fishing-restrictions-${{ steps.sets.outputs.fishing_restrictions }}
      - name: Save the efh-closed-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.efh_closed_areas != 'none' && (steps.sets.outputs.efh_closed_areas != steps.trees.outputs.efh_closed_areas || steps.efh-closed-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/efh-closed-areas
          key: fisheries-efh-closed-areas-${{ steps.sets.outputs.efh_closed_areas }}
      - name: Save the coral-protection tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.coral_protection != 'none' && (steps.sets.outputs.coral_protection != steps.trees.outputs.coral_protection || steps.coral-protection-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/coral-protection
          key: fisheries-coral-protection-${{ steps.sets.outputs.coral_protection }}
      - name: Save the ices-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.ices_areas != 'none' && (steps.sets.outputs.ices_areas != steps.trees.outputs.ices_areas || steps.ices-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/ices-areas
          key: fisheries-ices-areas-${{ steps.sets.outputs.ices_areas }}
      - name: Save the ices-rectangles tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.ices_rectangles != 'none' && (steps.sets.outputs.ices_rectangles != steps.trees.outputs.ices_rectangles || steps.ices-rectangles-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/ices-rectangles
          key: fisheries-ices-rectangles-${{ steps.sets.outputs.ices_rectangles }}
      - name: Save the dfo-areas tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.dfo_areas != 'none' && (steps.sets.outputs.dfo_areas != steps.trees.outputs.dfo_areas || steps.dfo-areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/dfo-areas
          key: fisheries-dfo-areas-${{ steps.sets.outputs.dfo_areas }}
      - name: Save the nafo-divisions tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.nafo_divisions != 'none' && (steps.sets.outputs.nafo_divisions != steps.trees.outputs.nafo_divisions || steps.nafo-divisions-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/nafo-divisions
          key: fisheries-nafo-divisions-${{ steps.sets.outputs.nafo_divisions }}
      - name: Save the marine-refuges tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.marine_refuges != 'none' && (steps.sets.outputs.marine_refuges != steps.trees.outputs.marine_refuges || steps.marine-refuges-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/marine-refuges
          key: fisheries-marine-refuges-${{ steps.sets.outputs.marine_refuges }}
      - name: Upload the site
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
      # What this origin publishes to R2 alone (the site pipeline's D13, its
      # note of 2026-10-09), and R2's whole status: the R2 job lays it beside
      # the site. Public for the day it is kept, so open data only.
      - name: Hand on what R2 alone carries
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-only
          path: out-r2
          retention-days: 1
      - name: Upload the branch content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-out
          path: branch-out
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the branch content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branch-out
          path: branch-out
      - name: Publish the branch
        run: |
          cd branch-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:published
      - name: Configure Pages
        if: needs.build.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        if: needs.build.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # R2 stands on its own (the site's pipeline D12): beside the Pages deploy,
  # not after it, and neither side's failure stops the other.
  publish-r2:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The publish, and beside it the writer it packs a tile set into one
      # archive with (scripts/tile_archive.py).
      - name: Check out the publish script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          path: code
          sparse-checkout: |
            pipeline
            scripts
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages
      - name: Download what R2 alone carries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r2-only
          path: r2-only
      - name: Test the publish script
        run: python3 code/pipeline/test_publish_r2.py
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          mkdir site
          tar -xf pages/artifact.tar -C site
          python3 code/pipeline/publish_r2.py site "$GITHUB_REPOSITORY" --with r2-only
